# Module 2 training configuration
data:
  raw_dir: training/data/raw
  annotations_dir: training/data/annotations
  processed_dir: training/data/processed
  image_size_detector: 640
  image_size_angulation: 224
  image_size_segmentation: 512

detector:
  num_classes: 32
  epochs: 50
  batch_size: 4
  learning_rate: 0.0001

angulation:
  num_classes: 4
  epochs: 30
  batch_size: 16
  learning_rate: 0.0001
  labels:
    - Mesioangular
    - Vertical
    - Horizontal
    - Distoangular

segmentation:
  num_classes: 2
  epochs: 40
  batch_size: 4
  learning_rate: 0.0001

export:
  models_store: models_store

metrics_targets:
  map_50: 0.90
  angulation_f1: 0.85
  dice: 0.80
  bone_loss_mae_mm: 1.0
  kappa: 0.80
