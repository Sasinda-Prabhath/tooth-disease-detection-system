[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-fdi"
version = "0.2.0"
description = "Dental FDI review with YOLO26, EfficientNet-B0 and ResNet50 fusion"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1", "torchvision>=0.16", "ultralytics>=8.4.171",
  "streamlit>=1.64", "numpy>=1.24,<2", "pandas>=2", "Pillow>=10",
  "opencv-python>=4.8,<4.12", "PyYAML>=6", "pi-heif>=1.4"
]

[project.optional-dependencies]
browser-tests = ["playwright>=1.40"]

[tool.setuptools.packages.find]
include = ["dental_fdi*"]

[tool.setuptools.package-data]
"dental_fdi.ui" = ["assets/*.css", "assets/axis_component/*", "assets/box_component/*"]
