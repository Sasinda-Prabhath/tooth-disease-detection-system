upstream api_gateway {
    server api-gateway:8000;
}

upstream frontend {
    server frontend-dev:3000;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://api_gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend/;
        proxy_set_header Host $host;
    }
}
