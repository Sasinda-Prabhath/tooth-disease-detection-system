services:
  module2-train:
    build:
      context: .
      dockerfile: services/module2-impaction-boneloss/Dockerfile
      args:
        INSTALL_ML: "true"
    volumes:
      - ./services/module2-impaction-boneloss/data:/app/data
      - ./services/module2-impaction-boneloss/models:/app/models
      - ./services/module2-impaction-boneloss/runs:/app/runs
    command: ["python", "-m", "training.train_fdi", "data/fdi_segmentation/dataset.yaml", "--device", "cpu"]
